openapi: 3.1.0
info:
  title: Generative Equipment Service
  version: 0.1.0
servers:
  - url: http://127.0.0.1:8765
security:
  - internalBearer: []
paths:
  /health/live:
    get:
      summary: Public liveness
      parameters: []
      responses:
        "200":
          description: Success or idempotent replay
        "400":
          description: Invalid request
        "401":
          description: Authentication required
        "404":
          description: Resource unavailable
        "409":
          description: State or idempotency conflict
        "422":
          description: Contract validation failed
        "501":
          description: Not implemented in S0
        "503":
          description: Dependency unavailable
      security: []
  /v1/health/ready:
    get:
      summary: Dependency readiness; S0 returns 503
      parameters: []
      responses:
        "200":
          description: Success or idempotent replay
        "400":
          description: Invalid request
        "401":
          description: Authentication required
        "404":
          description: Resource unavailable
        "409":
          description: State or idempotency conflict
        "422":
          description: Contract validation failed
        "501":
          description: Not implemented in S0
        "503":
          description: Dependency unavailable
  /v1/hosts/{hostId}/capability-profiles:
    post:
      summary: Register immutable host capabilities
      parameters:
        - name: hostId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Success or idempotent replay
        "201":
          description: Profile registered
        "400":
          description: Invalid request
        "401":
          description: Authentication required
        "404":
          description: Resource unavailable
        "409":
          description: State or idempotency conflict
        "422":
          description: Contract validation failed
        "501":
          description: Not implemented in S0
        "503":
          description: Dependency unavailable
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CapabilityProfile"
  /v1/worlds/{worldId}/materials:
    get:
      summary: Read enabled materials and input policy
      parameters:
        - name: worldId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Success or idempotent replay
        "400":
          description: Invalid request
        "401":
          description: Authentication required
        "404":
          description: Resource unavailable
        "409":
          description: State or idempotency conflict
        "422":
          description: Contract validation failed
        "501":
          description: Not implemented in S0
        "503":
          description: Dependency unavailable
  /v1/generations:
    post:
      summary: Persist a generation task; S0 worker fails with NOT_IMPLEMENTED
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Success or idempotent replay
        "202":
          description: Task persisted; not a generation success
        "400":
          description: Invalid request
        "401":
          description: Authentication required
        "404":
          description: Resource unavailable
        "409":
          description: State or idempotency conflict
        "422":
          description: Contract validation failed
        "501":
          description: Not implemented in S0
        "503":
          description: Dependency unavailable
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenerationRequest"
  /v1/generations/{taskId}:
    get:
      summary: Get a generation task
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Success or idempotent replay
        "400":
          description: Invalid request
        "401":
          description: Authentication required
        "404":
          description: Resource unavailable
        "409":
          description: State or idempotency conflict
        "422":
          description: Contract validation failed
        "501":
          description: Not implemented in S0
        "503":
          description: Dependency unavailable
  /v1/generations/{taskId}/cancel:
    post:
      summary: Cancel a nonterminal task
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Success or idempotent replay
        "400":
          description: Invalid request
        "401":
          description: Authentication required
        "404":
          description: Resource unavailable
        "409":
          description: State or idempotency conflict
        "422":
          description: Contract validation failed
        "501":
          description: Not implemented in S0
        "503":
          description: Dependency unavailable
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CancelRequest"
  /v1/definitions/{id}/versions/{version}:
    get:
      summary: Get a verified definition; none published in S0
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: version
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Success or idempotent replay
        "400":
          description: Invalid request
        "401":
          description: Authentication required
        "404":
          description: Resource unavailable
        "409":
          description: State or idempotency conflict
        "422":
          description: Contract validation failed
        "501":
          description: Not implemented in S0
        "503":
          description: Dependency unavailable
  /v1/definitions/{id}/versions/{version}/bundle:
    get:
      summary: Download verified bundle; unavailable in S0
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: version
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Success or idempotent replay
        "400":
          description: Invalid request
        "401":
          description: Authentication required
        "404":
          description: Resource unavailable
        "409":
          description: State or idempotency conflict
        "422":
          description: Contract validation failed
        "501":
          description: Not implemented in S0
        "503":
          description: Dependency unavailable
  /v1/definitions/{id}/versions/{version}/provenance:
    get:
      summary: Get immutable provenance; unavailable in S0
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: version
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Success or idempotent replay
        "400":
          description: Invalid request
        "401":
          description: Authentication required
        "404":
          description: Resource unavailable
        "409":
          description: State or idempotency conflict
        "422":
          description: Contract validation failed
        "501":
          description: Not implemented in S0
        "503":
          description: Dependency unavailable
  /v1/generations/{taskId}/delivery-events:
    post:
      summary: Delivery port; S0 returns NOT_IMPLEMENTED
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Success or idempotent replay
        "400":
          description: Invalid request
        "401":
          description: Authentication required
        "404":
          description: Resource unavailable
        "409":
          description: State or idempotency conflict
        "422":
          description: Contract validation failed
        "501":
          description: Not implemented in S0
        "503":
          description: Dependency unavailable
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeliveryEvent"
  /v1/observations/batch:
    post:
      summary: Observation port; S0 returns NOT_IMPLEMENTED
      parameters: []
      responses:
        "200":
          description: Success or idempotent replay
        "400":
          description: Invalid request
        "401":
          description: Authentication required
        "404":
          description: Resource unavailable
        "409":
          description: State or idempotency conflict
        "422":
          description: Contract validation failed
        "501":
          description: Not implemented in S0
        "503":
          description: Dependency unavailable
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ObservationBatch"
  /v1/observations:
    get:
      summary: Query observations; S0 returns NOT_IMPLEMENTED
      parameters: []
      responses:
        "200":
          description: Success or idempotent replay
        "400":
          description: Invalid request
        "401":
          description: Authentication required
        "404":
          description: Resource unavailable
        "409":
          description: State or idempotency conflict
        "422":
          description: Contract validation failed
        "501":
          description: Not implemented in S0
        "503":
          description: Dependency unavailable
components:
  securitySchemes:
    internalBearer:
      type: http
      scheme: bearer
  schemas:
    DefinitionRef:
      type: object
      properties:
        definitionId:
          type: string
          pattern: ^[A-Za-z0-9][A-Za-z0-9_.:-]{0,127}$
        version:
          type: integer
          minimum: 1
      required:
        - definitionId
        - version
      additionalProperties: false
    WorldRef:
      type: object
      properties:
        id:
          type: string
          pattern: ^[A-Za-z0-9][A-Za-z0-9_.:-]{0,127}$
        version:
          type: string
          minLength: 1
          maxLength: 256
      required:
        - id
        - version
      additionalProperties: false
    WorldPosition:
      type: object
      properties:
        worldId:
          type: string
          pattern: ^[A-Za-z0-9][A-Za-z0-9_.:-]{0,127}$
        x:
          type: number
        y:
          type: number
        z:
          type: number
      required:
        - worldId
        - x
        - y
        - z
      additionalProperties: false
    Vec3:
      type: object
      properties:
        x:
          type: number
        y:
          type: number
        z:
          type: number
      required:
        - x
        - y
        - z
      additionalProperties: false
    ApiError:
      type: object
      properties:
        schemaVersion:
          const: 1
        requestId:
          type: string
          minLength: 1
          maxLength: 256
        error:
          type: object
          properties:
            code:
              type: string
              minLength: 1
              maxLength: 256
            message:
              type: string
              minLength: 1
              maxLength: 256
            retryable:
              type: boolean
            details:
              type: object
              maxProperties: 128
              additionalProperties: true
          required:
            - code
            - message
            - retryable
          additionalProperties: false
      required:
        - schemaVersion
        - requestId
        - error
      additionalProperties: false
    GenerationContext:
      type: object
      properties:
        dimension:
          type: string
          pattern: ^[a-z0-9_]+:[a-z0-9_./-]+$
        biome:
          anyOf:
            - type: string
              pattern: ^[a-z0-9_]+:[a-z0-9_./-]+$
            - type: "null"
        position:
          $ref: "#/components/schemas/WorldPosition"
        worldTimeTicks:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        weather:
          type: object
          properties:
            worldRain:
              anyOf:
                - type: boolean
                - type: "null"
            exposedToRain:
              anyOf:
                - type: boolean
                - type: "null"
          required:
            - worldRain
            - exposedToRain
          additionalProperties: false
        nearbyBlocks:
          type: object
          properties:
            samplingVersion:
              type: string
              minLength: 1
              maxLength: 256
            samples:
              type: array
              items:
                type: object
                properties:
                  blockId:
                    type: string
                    pattern: ^[a-z0-9_]+:[a-z0-9_./-]+$
                  count:
                    type: integer
                    minimum: 1
                required:
                  - blockId
                  - count
                additionalProperties: false
              maxItems: 64
            missingReason:
              anyOf:
                - type: string
                  minLength: 1
                  maxLength: 256
                - type: "null"
          required:
            - samplingVersion
            - samples
            - missingReason
          additionalProperties: false
      required:
        - dimension
        - biome
        - position
        - worldTimeTicks
        - weather
        - nearbyBlocks
      additionalProperties: false
    CapabilityProfile:
      type: object
      properties:
        profileId:
          type: string
          pattern: ^[A-Za-z0-9][A-Za-z0-9_.:-]{0,127}$
        hostId:
          type: string
          pattern: ^[A-Za-z0-9][A-Za-z0-9_.:-]{0,127}$
        hostBuildId:
          type: string
          minLength: 1
          maxLength: 256
        protocolVersion:
          const: "1"
        engineBuildId:
          type: string
          minLength: 1
          maxLength: 256
        events:
          type: array
          items:
            type: string
            pattern: ^[A-Za-z0-9][A-Za-z0-9_.:-]{0,127}$
          maxItems: 128
        queries:
          type: array
          items:
            type: string
            pattern: ^[A-Za-z0-9][A-Za-z0-9_.:-]{0,127}$
          maxItems: 128
        operations:
          type: array
          items:
            type: string
            pattern: ^[A-Za-z0-9][A-Za-z0-9_.:-]{0,127}$
          maxItems: 128
        visuals:
          type: array
          items:
            type: string
            pattern: ^[A-Za-z0-9][A-Za-z0-9_.:-]{0,127}$
          maxItems: 128
        limits:
          type: object
          maxProperties: 128
          additionalProperties: true
      required:
        - profileId
        - hostId
        - hostBuildId
        - protocolVersion
        - engineBuildId
        - events
        - queries
        - operations
        - visuals
        - limits
      additionalProperties: false
    CueSpec:
      type: object
      properties:
        category:
          type: string
          enum:
            - preview
            - ongoing
            - result
            - failure
        audience:
          type: string
          enum:
            - actor
            - nearby
        maxDistance:
          type: number
          minimum: 0
          maximum: 64
        durationTicks:
          type: integer
          minimum: 1
          maximum: 1200
        recipe:
          type: object
          maxProperties: 128
          additionalProperties: true
        renderer:
          const: render
        requiredReceiptStatus:
          type: array
          items:
            type: string
            enum:
              - PROPOSED
              - APPLIED
              - REJECTED
              - ERROR
          maxItems: 4
      required:
        - category
        - audience
        - durationTicks
      additionalProperties: false
    PresentationSpec:
      type: object
      properties:
        cues:
          type: object
          maxProperties: 64
          additionalProperties:
            $ref: "#/components/schemas/CueSpec"
        bindings:
          type: array
          items:
            type: object
            properties:
              cueId:
                type: string
                pattern: ^[A-Za-z0-9][A-Za-z0-9_.:-]{0,127}$
              trigger:
                type: string
                enum:
                  - activity.phase
                  - operation.receipt
                  - feedback
              match:
                type: object
                maxProperties: 128
                additionalProperties: true
            required:
              - cueId
              - trigger
              - match
            additionalProperties: false
          maxItems: 128
      required:
        - cues
        - bindings
      additionalProperties: false
    EquipmentSource:
      type: object
      properties:
        formatVersion:
          const: 1
        name:
          type: string
          minLength: 1
          maxLength: 80
        description:
          type: string
          maxLength: 512
        inputRelation:
          type: string
          maxLength: 256
        baseItem:
          type: string
          pattern: ^[a-z0-9_]+:[a-z0-9_./-]+$
        activationSlots:
          type: array
          items:
            type: string
            enum:
              - main_hand
              - off_hand
              - head
              - chest
              - legs
              - feet
          maxItems: 6
        stateSchema:
          type: object
          maxProperties: 128
          additionalProperties: true
        initialState:
          type: object
          maxProperties: 128
          additionalProperties: true
        parameters:
          type: object
          maxProperties: 128
          additionalProperties: true
        subscriptions:
          type: array
          items:
            type: string
            pattern: ^[A-Za-z0-9][A-Za-z0-9_.:-]{0,127}$
          maxItems: 128
        requires:
          type: object
          properties:
            queries:
              type: array
              items:
                type: string
                pattern: ^[A-Za-z0-9][A-Za-z0-9_.:-]{0,127}$
              maxItems: 128
            operations:
              type: array
              items:
                type: string
                pattern: ^[A-Za-z0-9][A-Za-z0-9_.:-]{0,127}$
              maxItems: 128
          required:
            - queries
            - operations
          additionalProperties: false
        constraints:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                pattern: ^[A-Za-z0-9][A-Za-z0-9_.:-]{0,127}$
              text:
                type: string
                minLength: 1
                maxLength: 256
              handler:
                const: onEvent
              scenarioIds:
                type: array
                items:
                  type: string
                  pattern: ^[A-Za-z0-9][A-Za-z0-9_.:-]{0,127}$
                maxItems: 128
            required:
              - id
              - text
              - handler
              - scenarioIds
            additionalProperties: false
          maxItems: 32
        presentation:
          $ref: "#/components/schemas/PresentationSpec"
        scenarios:
          type: array
          items:
            type: object
            maxProperties: 128
            additionalProperties: true
          maxItems: 16
      required:
        - formatVersion
        - name
        - description
        - baseItem
        - activationSlots
        - stateSchema
        - initialState
        - parameters
        - subscriptions
        - requires
      additionalProperties: false
    GeneratedSource:
      type: object
      properties:
        equipment:
          $ref: "#/components/schemas/EquipmentSource"
        behaviorSource:
          type: string
          minLength: 1
          maxLength: 131072
      required:
        - equipment
        - behaviorSource
      additionalProperties: false
    MaterialInput:
      type: object
      properties:
        definitionId:
          type: string
          pattern: ^[a-z0-9_]+:[a-z0-9_./-]+$
        count:
          type: integer
          minimum: 1
          maximum: 64
      required:
        - definitionId
        - count
      additionalProperties: false
    SourceEquipment:
      type: object
      properties:
        definitionId:
          type: string
          pattern: ^[A-Za-z0-9][A-Za-z0-9_.:-]{0,127}$
        version:
          type: integer
          minimum: 1
        bundleHash:
          type: string
          minLength: 1
          maxLength: 256
        state:
          type: object
          maxProperties: 128
          additionalProperties: true
      required:
        - definitionId
        - version
        - bundleHash
        - state
      additionalProperties: false
    GenerationRequest:
      type: object
      properties:
        schemaVersion:
          const: 1
        taskId:
          type: string
          pattern: ^[A-Za-z0-9][A-Za-z0-9_.:-]{0,127}$
        hostId:
          type: string
          pattern: ^[A-Za-z0-9][A-Za-z0-9_.:-]{0,127}$
        recipientPlayerId:
          type: string
          pattern: ^[A-Za-z0-9][A-Za-z0-9_.:-]{0,127}$
        worldRuleRef:
          $ref: "#/components/schemas/WorldRef"
        capabilityProfileId:
          type: string
          pattern: ^[A-Za-z0-9][A-Za-z0-9_.:-]{0,127}$
        intentText:
          type: string
          maxLength: 256
        materials:
          type: array
          items:
            $ref: "#/components/schemas/MaterialInput"
          maxItems: 8
        sourceEquipment:
          type: array
          items:
            $ref: "#/components/schemas/SourceEquipment"
          maxItems: 4
        generationContext:
          $ref: "#/components/schemas/GenerationContext"
      required:
        - schemaVersion
        - taskId
        - hostId
        - recipientPlayerId
        - worldRuleRef
        - capabilityProfileId
        - intentText
        - materials
        - sourceEquipment
        - generationContext
      additionalProperties: false
    GenerationView:
      type: object
      properties:
        schemaVersion:
          const: 1
        taskId:
          type: string
          pattern: ^[A-Za-z0-9][A-Za-z0-9_.:-]{0,127}$
        status:
          type: string
          enum:
            - QUEUED
            - GENERATING
            - VALIDATING
            - REPAIRING
            - READY
            - FAILED
            - CANCELLED
        revision:
          type: integer
          minimum: 1
        inputHash:
          type: string
          minLength: 1
          maxLength: 256
        definitionRef:
          anyOf:
            - $ref: "#/components/schemas/DefinitionRef"
            - type: "null"
        error:
          anyOf:
            - type: object
              maxProperties: 128
              additionalProperties: true
            - type: "null"
        createdAt:
          type: string
          format: date-time
      required:
        - schemaVersion
        - taskId
        - status
        - revision
        - inputHash
        - definitionRef
        - error
        - createdAt
      additionalProperties: false
    CancelRequest:
      type: object
      properties:
        requestId:
          type: string
          pattern: ^[A-Za-z0-9][A-Za-z0-9_.:-]{0,127}$
        reason:
          type: string
          minLength: 1
          maxLength: 256
      required:
        - requestId
        - reason
      additionalProperties: false
    DeliveryEvent:
      type: object
      properties:
        eventId:
          type: string
          pattern: ^[A-Za-z0-9][A-Za-z0-9_.:-]{0,127}$
        deliveryId:
          type: string
          pattern: ^[A-Za-z0-9][A-Za-z0-9_.:-]{0,127}$
        hostId:
          type: string
          pattern: ^[A-Za-z0-9][A-Za-z0-9_.:-]{0,127}$
        taskId:
          type: string
          pattern: ^[A-Za-z0-9][A-Za-z0-9_.:-]{0,127}$
        sequenceNo:
          type: integer
          minimum: 1
        state:
          type: string
          enum:
            - NOT_STARTED
            - WAITING_PLAYER
            - PREPARED
            - APPLIED
            - ACKNOWLEDGED
            - RECOVERY_REQUIRED
            - REFUNDED
        evidence:
          type: object
          maxProperties: 128
          additionalProperties: true
      required:
        - eventId
        - deliveryId
        - hostId
        - taskId
        - sequenceNo
        - state
        - evidence
      additionalProperties: false
    Observation:
      type: object
      properties:
        eventId:
          type: string
          pattern: ^[A-Za-z0-9][A-Za-z0-9_.:-]{0,127}$
        definitionRef:
          $ref: "#/components/schemas/DefinitionRef"
        codeHash:
          type: string
          minLength: 1
          maxLength: 256
        activationId:
          type: string
          pattern: ^[A-Za-z0-9][A-Za-z0-9_.:-]{0,127}$
        activityId:
          anyOf:
            - type: string
              pattern: ^[A-Za-z0-9][A-Za-z0-9_.:-]{0,127}$
            - type: "null"
        kind:
          type: string
          minLength: 1
          maxLength: 256
        payload:
          type: object
          maxProperties: 128
          additionalProperties: true
        observedAt:
          type: string
          format: date-time
      required:
        - eventId
        - definitionRef
        - codeHash
        - activationId
        - activityId
        - kind
        - payload
        - observedAt
      additionalProperties: false
    ObservationBatch:
      type: array
      items:
        $ref: "#/components/schemas/Observation"
      maxItems: 100
    PackageManifest:
      type: object
      properties:
        packageFormatVersion:
          const: 1
        definitionRef:
          $ref: "#/components/schemas/DefinitionRef"
        protocolVersion:
          const: "1"
        capabilityProfileId:
          type: string
          pattern: ^[A-Za-z0-9][A-Za-z0-9_.:-]{0,127}$
        engineBuildId:
          type: string
          minLength: 1
          maxLength: 256
        worldRuleRef:
          $ref: "#/components/schemas/WorldRef"
        sourceHash:
          type: string
          minLength: 1
          maxLength: 256
        files:
          type: array
          items:
            type: object
            properties:
              path:
                type: string
                minLength: 1
                maxLength: 256
              sha256:
                type: string
                pattern: ^[a-f0-9]{64}$
              bytes:
                type: integer
                minimum: 0
                maximum: 9007199254740991
            required:
              - path
              - sha256
              - bytes
            additionalProperties: false
          maxItems: 32
        subscriptions:
          type: array
          items:
            type: string
